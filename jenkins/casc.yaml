jenkins:
  systemMessage: "Taverna Sorte - Jenkins"
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "render-deploy-hook"
              secret: "${RENDER_DEPLOY_HOOK}"
              description: "Deploy Hook do Render"

jobs:
  - script: |
      multibranchPipelineJob('taverna-sorte') {
          branchSources {
              branchSource {
                  source {
                      git {
                          id('taverna-sorte-git')
                          remote(System.getenv('GITHUB_REPO_URL'))
                          traits {
                              gitBranchDiscovery()
                          }
                      }
                  }
              }
          }
          factory {
              workflowBranchProjectFactory {
                  scriptPath('Jenkinsfile')
              }
          }
          triggers {
              periodicFolderTrigger {
                  interval('1m')
              }
          }
      }
