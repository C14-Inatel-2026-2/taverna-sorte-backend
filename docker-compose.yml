services:
  mysql:
    image: mysql:8.4
    container_name: taverna-sorte-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taverna_sorte
      MYSQL_USER: taverna
      MYSQL_PASSWORD: taverna123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  jenkins:
    build: ./jenkins
    container_name: taverna-jenkins
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro

volumes:
  mysql_data:
  jenkins_home:
