services:
  mysql:
    image: mysql:8.4
    container_name: taverna-sorte-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taverna_sorte
      MYSQL_USER: taverna
      MYSQL_PASSWORD: taverna123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: